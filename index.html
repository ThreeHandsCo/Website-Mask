  <style>

    body,

      height: 100%;
      margin: 0;
      border: 0;

    }

    :root.cursor-variant-b {
      --windows-cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAAAAAAAAPlDu38AAACdSURBVFjD7ZZBDsAgCARZ0v9/mV5KY9QWm8jag3syaGREBSAiJpfM7iFN6o7NTACsASgjwIbQ2sCG0J6RCaFPEywIfZtkQGi0IBsiBMiGGALIhBgGcM2GONgOPwOI5NaI5grqE1N/gTtipmJIpxwDaMLes02NQLk5tRZ4LxCJngd+UYwYes0DdRQyHmGYiLIb1eVXsAE2wAbYAMsBTlw5TTnmUsVfAAAAEHRFWHRjb21tAGN1cnNvci1i/4c32gAAAFF0RVh0c3ZnOmNvbW1lbnQAIENvbXBhY3QgV2luZG93cyAxLnjigJMzLjEgYXJyb3cgYml0bWFwOiAzMsOXMzMiBjYW52YXMsIGhvdHNwb3QgMCwwLiCYFdX5AAAAAElFTkSuQmCC") 0 0, auto;
    }

    @media (hover: hover) and (pointer: fine) {
      html,
      body,
      body * {
        cursor: var(--windows-cursor) !important;
      }
    }

    iframe {
      /* Keep the frame in normal flow so Safari can paint it beneath Liquid Glass. */
      display: block;
      height: 100vh;
      height: 100lvh;
      min-height: 100vh;
      min-height: 100lvh;
    }
  </style>
</head>
<body>
  <iframe
    src="https://threehands-website.tail220731.ts.net/"
    title="Three Hands"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen
  ></iframe>
  <noscript>
    <a href="https://threehands-website.tail220731.ts.net/">Open the Three Hands website</a>
  </noscript>
  <script>
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      (function() {
        const root = document.documentElement;
        let variantB = false;
        let refreshQueued = false;
        let refreshNeeded = true;

        function refreshCursor() {
          if (refreshQueued) return;
          refreshQueued = true;
          window.requestAnimationFrame(function() {
            variantB = !variantB;
            root.classList.toggle('cursor-variant-b', variantB);
            refreshNeeded = false;
            refreshQueued = false;
          });
        }

        function markCursorStale() {
          refreshNeeded = true;
        }

        document.documentElement.addEventListener('mouseenter', refreshCursor);
        document.documentElement.addEventListener('mouseleave', markCursorStale);
        document.addEventListener('mousemove', function() {
          if (refreshNeeded) refreshCursor();
        }, { passive: true });
        document.addEventListener('visibilitychange', function() {
          if (document.hidden) {
            markCursorStale();
          } else {
            refreshCursor();
          }
        });
        window.addEventListener('focus', refreshCursor);
        window.addEventListener('pageshow', refreshCursor);
        refreshCursor();
      })();
    }
  </script>
</body>
</html>
