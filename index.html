  <link rel="icon" type="image/png" sizes="32x32" href="https://threehands-website.tail220731.ts.net/favicon-32x32.png">
  <style>
    html,
    body,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      background: #000;

    body {

    }

    :root.cursor-variant-b {
      --windows-cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAAAAAAAAPlDu38AAACYSURBVFjD7ZZBDsAgCAQX0v9/mV40tdYW08h6YY5qZMCICgDDhYCMAoCZwczQyfAEKjsktB9gS+hokCmhbxMsCf2aZEiotyBawhWIlpgSiJSYFmhdVgoc3gKR2O7sClSPKIHHEfQZU29BDR5d9ltMjJ9jK5n3csvN2gq0mwurCloCu9F29AFKFf40oqXMpLj1z5gkSZKEcwLVBTcU8NatiwAAABB0RVh0Y29tbWVudABjdXJzb3ItYv+HN9oAAABRdEVYdHN2Zzpjb21tZW50ACBDb21wYWN0IFdpbmRvd3MgMS544oCTMy4xIGFycm93IGJpdG1hcDogMzLDlzMyIGNhbnZhcywgaG90c3BvdCAwLDAuIJgV1fkAAAAASUVORK5CYII=") 0 0, auto;
    }

    @media (hover: hover) and (pointer: fine) {
      html,
      body,
      body * {
        cursor: var(--windows-cursor) !important;
      }
    }

    iframe {
      /* Keep the frame in normal flow so Safari can paint it beneath Liquid Glass. */
      display: block;
      height: 100vh;
      height: 100lvh;
      min-height: 100vh;
      min-height: 100lvh;
    }
  </style>
</head>
<body>
  <iframe
    src="https://threehands-website.tail220731.ts.net/"
    title="Three Hands"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen
  ></iframe>
  <noscript>
    <a href="https://threehands-website.tail220731.ts.net/">Open the Three Hands website</a>
  </noscript>
  <script>
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      (function() {
        const root = document.documentElement;
        let variantB = false;
        let refreshQueued = false;
        let refreshNeeded = true;

        function refreshCursor() {
          if (refreshQueued) return;
          refreshQueued = true;
          window.requestAnimationFrame(function() {
            variantB = !variantB;
            root.classList.toggle('cursor-variant-b', variantB);
            refreshNeeded = false;
            refreshQueued = false;
          });
        }

        function markCursorStale() {
          refreshNeeded = true;
        }

        document.documentElement.addEventListener('mouseenter', refreshCursor);
        document.documentElement.addEventListener('mouseleave', markCursorStale);
        document.addEventListener('mousemove', function() {
          if (refreshNeeded) refreshCursor();
        }, { passive: true });
        document.addEventListener('visibilitychange', function() {
          if (document.hidden) {
            markCursorStale();
          } else {
            refreshCursor();
          }
        });
        window.addEventListener('focus', refreshCursor);
        window.addEventListener('pageshow', refreshCursor);
        refreshCursor();
      })();
    }
  </script>
</body>
</html>
