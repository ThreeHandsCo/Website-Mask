<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Three Hands — independent game studio">
  <meta property="og:title" content="Three Hands">
  <meta property="og:description" content="Independent game studio">
  <meta property="og:url" content="https://threehands.dev/">
  <title>Three Hands</title>
  <link rel="canonical" href="https://threehands.dev/">
  <link rel="icon" type="image/png" sizes="32x32" href="https://threehands-website.tail220731.ts.net/favicon-32x32.png">
  <style>
    html,
    body,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      background: #000;
    }

    body {
      overflow: hidden;
      min-height: 100vh;
      min-height: 100lvh;
    }

    @media (hover: hover) and (pointer: fine) {
      html,
      body,
      body * {
        cursor: url('https://threehands-website.tail220731.ts.net/assets/windows-3.1-cursor.svg') 0 0, auto;
      }

      /* Force Chromium to re-read the cursor when the pointer re-enters the window. */
      body.force-cursor-refresh,
      body.force-cursor-refresh * {
        cursor: url('https://threehands-website.tail220731.ts.net/assets/windows-3.1-cursor.svg') 0 0, auto !important;
      }
    }

    iframe {
      /* Keep the frame in normal flow so Safari can paint it beneath Liquid Glass. */
      display: block;
      height: 100vh;
      height: 100lvh;
      min-height: 100vh;
      min-height: 100lvh;
    }
  </style>
</head>
<body>
  <iframe
    src="https://threehands-website.tail220731.ts.net/"
    title="Three Hands"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen
  ></iframe>
  <noscript>
    <a href="https://threehands-website.tail220731.ts.net/">Open the Three Hands website</a>
  </noscript>
  <script>
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      let cursorRefreshScheduled = false;

      function forceCursorRefresh() {
        if (cursorRefreshScheduled) return;
        cursorRefreshScheduled = true;
        document.body.classList.add('force-cursor-refresh');
        window.requestAnimationFrame(function() {
          document.body.classList.remove('force-cursor-refresh');
          cursorRefreshScheduled = false;
        });
      }

      window.addEventListener('mouseenter', forceCursorRefresh);
      window.addEventListener('focus', forceCursorRefresh);
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) forceCursorRefresh();
      });
    }
  </script>
</body>
</html>
