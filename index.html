<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Three Hands — handmade strange games.">
  <meta property="og:title" content="Three Hands">
  <meta property="og:description" content="Handmade strange games.">

  <title>Three Hands</title>
  <link rel="canonical" href="https://threehands.dev/">
  <link rel="icon" type="image/png" sizes="32x32" href="https://threehands-website.tail220731.ts.net/favicon-32x32.png">
  <style>
    html,
    body,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      background: #000;
    }

    body {
      overflow: hidden;
      min-height: 100vh;
      min-height: 100lvh;
    }

    :root {
      --windows-cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAAAAAAAAPlDu38AAACQSURBVFjD7ZZBCoAwDAQ3i///crxUqbG2HtpEJAMF2wg7rggCgJYVAgFAVRElweMiSoL1JkKC9sBbgq1DTwk+Dbwk2Bt6SHB0w2qJocBqia03FJGbCwDBRG4NNELFrKlcBBrhyzkFSrjUIm5fQR2OBTW/acCGilcL9H5iyyhcSwP2NU1t4POE/rIlSZIk/2cHS9I1Fe321T4AAAARdEVYdGNvbW1lbnQAYmxvY2t5LWEzc9eBsgAAAABJRU5ErkJggg==") 0 0, auto;
    }

    :root.cursor-variant-b {
      --windows-cursor: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAAAAAAAAPlDu38AAACQSURBVFjD7ZZBCoAwDAQ3i///crxUqbG2HtpEJAMF2wg7rggCgJYVAgFAVRElweMiSoL1JkKC9sBbgq1DTwk+Dbwk2Bt6SHB0w2qJocBqia03FJGbCwDBRG4NNELFrKlcBBrhyzkFSrjUIm5fQR2OBTW/acCGilcL9H5iyyhcSwP2NU1t4POE/rIlSZIk/2cHS9I1Fe321T4AAAARdEVYdGNvbW1lbnQAYmxvY2t5LWIzWPrScQAAAABJRU5ErkJggg==") 0 0, auto;
    }

    html,
    body,
    body * {
      cursor: var(--windows-cursor) !important;
    }

    /* Use the blocky RGB cursor from the Website origin. */
    :root {
      --windows-cursor: url('https://threehands-website.tail220731.ts.net/assets/windows-3.1-cursor-rgb-a.svg') 0 0, auto;
    }

    :root.cursor-variant-b {
      --windows-cursor: url('https://threehands-website.tail220731.ts.net/assets/windows-3.1-cursor-rgb-b.svg') 0 0, auto;
    }

    iframe {
      /* Keep the frame in normal flow so Safari can paint it beneath Liquid Glass. */
      display: block;
      height: 100vh;
      height: 100lvh;
      min-height: 100vh;
      min-height: 100lvh;
    }
  </style>
</head>
<body>
  <iframe
    src="https://threehands-website.tail220731.ts.net/"
    title="Three Hands"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen
  ></iframe>
  <noscript>
    <a href="https://threehands-website.tail220731.ts.net/">Open the Three Hands website</a>
  </noscript>
  <script>
    (function() {
      const root = document.documentElement;
      let variantB = false;
      let lastRefresh = 0;

      function refreshCursor() {
        const now = Date.now();
        if (now - lastRefresh < 80) return;
        lastRefresh = now;
        variantB = !variantB;
        root.classList.toggle('cursor-variant-b', variantB);
      }

      document.documentElement.addEventListener('mouseenter', refreshCursor);
      document.addEventListener('mousemove', refreshCursor, { passive: true });
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) refreshCursor();
      });
      window.addEventListener('focus', refreshCursor);
      window.addEventListener('pageshow', refreshCursor);
      window.addEventListener('blur', function() {
        lastRefresh = 0;
      });
      refreshCursor();
    })();
  </script>
</body>
</html>
